<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424"
     font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    Every colour is an inline presentation attribute on purpose. GitHub
    sanitises SVG, and if a <style> block were stripped these rects would fall
    back to fill:black and swallow the diagram.
    Greys chosen to stay legible on both light and dark README backgrounds.
  -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- ===================== the email ===================== -->
  <text x="24" y="26" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="1">WHAT MAILSUITE PUTS IN YOUR EMAIL</text>

  <rect x="24" y="40" width="336" height="196" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="44" y="68" fill="#6b7280" font-size="13">Hi Bob, here's the doc.</text>
  <text x="44" y="86" fill="#9ca3af" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">you wrote this</text>

  <rect x="44" y="104" width="296" height="50" rx="5" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="56" y="124" fill="#059669" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;img src=".../trace/mail/a3f9.png"&gt;</text>
  <text x="56" y="142" fill="#059669" font-size="11">1&#215;1, invisible &#183; does all the work</text>

  <rect x="44" y="164" width="296" height="50" rx="5" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="184" fill="#dc2626" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;div id="mt-signature"&gt;</text>
  <text x="56" y="202" fill="#dc2626" font-size="11">visible &#183; does nothing &#183; an advert</text>

  <circle cx="30" cy="258" r="5" fill="#059669"/>
  <text x="42" y="262" fill="#6b7280" font-size="12">kept, tracking needs it</text>
  <circle cx="30" cy="280" r="5" fill="#dc2626"/>
  <text x="42" y="284" fill="#6b7280" font-size="12">deleted by this extension</text>

  <!-- ===================== where we sit ===================== -->
  <text x="24" y="326" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="1">WHERE THIS EXTENSION SITS</text>
  <text x="24" y="350" fill="#6b7280" font-size="12">Mailsuite injects both. Nothing of theirs is patched or</text>
  <text x="24" y="368" fill="#6b7280" font-size="12">replaced. This deletes one &lt;div&gt; from the compose box</text>
  <text x="24" y="386" fill="#6b7280" font-size="12">before send, and leaves everything else running:</text>
  <text x="24" y="408" fill="#9ca3af" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">receipts, notifications, dashboard, campaigns</text>

  <!-- ===================== the loop ===================== -->
  <text x="424" y="26" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="1">HOW THE READ RECEIPT HAPPENS</text>

  <rect x="424" y="40" width="312" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="63" fill="#6b7280" font-size="13"><tspan font-weight="700">1</tspan>   you hit send</text>
  <line x1="580" y1="76" x2="580" y2="96" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="424" y="98" width="312" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="121" fill="#6b7280" font-size="13"><tspan font-weight="700">2</tspan>   Gmail mails the HTML, pixel included</text>
  <line x1="580" y1="134" x2="580" y2="154" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="424" y="156" width="312" height="50" rx="6" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="177" fill="#059669" font-size="13"><tspan font-weight="700">3</tspan>   Bob opens it, his mail client</text>
  <text x="440" y="195" fill="#059669" font-size="13">     loads that pixel from mailsuite.com</text>
  <line x1="580" y1="206" x2="580" y2="226" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="424" y="228" width="312" height="36" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="251" fill="#6b7280" font-size="13"><tspan font-weight="700">4</tspan>   their server logs "a3f9 = opened"</text>
  <line x1="580" y1="264" x2="580" y2="284" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="424" y="286" width="312" height="50" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="307" fill="#6b7280" font-size="13"><tspan font-weight="700">5</tspan>   Mailsuite polls /trace/2/status</text>
  <text x="440" y="325" fill="#6b7280" font-size="13">     and paints the ticks &#10003;&#10003;</text>

  <text x="424" y="368" fill="#6b7280" font-size="12">The watermark appears nowhere in this loop.</text>
  <text x="424" y="386" fill="#6b7280" font-size="12">Deleting it changes nothing about steps 1 to 5.</text>
</svg>
